name: CI-CD for livestream
on:
  push:
    branches: [backend]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set commit ID as an environment variable
        run: echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push server Docker image
        run: |
          docker build -t exartadev/zeniva.exarta:livestream-backend-v${COMMIT_COUNT}-asrpods .
          docker push exartadev/zeniva.exarta:livestream-backend-v${COMMIT_COUNT}-asrpods

      - name: Checkout deployment branch
        uses: actions/checkout@v2
        with:
          ref: "backend" # Specify the deployment branch
          path: "deployment-files" # Set the path to store the checked out deployment branch files

      - name: Read lines server from file
        run: |
          result=$(grep "livestream-backend-v" deployment-files/deployment.yml)
          echo "$result"

      - name: Set commit ID as an environment variable
        run: echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Modify Server yml
        uses: teunmooij/yml@v1
        with:
          from-file: "deployment-files/deployment.yml"
          to-file: "deployment-files/deployment.yml"
          merge: '{"spec.template.spec.containers[0].image": "exartadev/zeniva.exarta:livestream-backend-v${{ env.COMMIT_COUNT }}-asrpods"}'

      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - run: kubectl version --client

      - uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: "${{secrets.KUBE_CONFIG}}"
        with:
          args: |
            apply -f deployment-files/deployment.yml

      - name: Commit and push changes
        run: |
          cd deployment-files
          git config --global user.email "hamad@exarta.com"
          git config --global user.name "hamad"
          git add deployment.yml
          git commit -m "Update livestream-backend-v${COMMIT_COUNT} image tag to deployment.yml"
          git push
