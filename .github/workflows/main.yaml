name: CI-CD for livestream
on:
  push:
    branches: [frontend]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set commit ID as an environment variable
        run: echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push client Docker image
        run: |
          cd "backend"
          docker build -t exartadev/zeniva.exarta:livestream-frontend-v${COMMIT_COUNT}-asrpods .
          docker push exartadev/zeniva.exarta:livestream-frontend-v${COMMIT_COUNT}-asrpods

      - name: Checkout deployment branch
        uses: actions/checkout@v2
        with:
          ref: "frontend" # Specify the deployment branch
          path: "deployment-files" # Set the path to store the checked out deployment branch files

      - name: Read line client from file
        run: |
          result=$(grep "livestream-frontend-v" deployment-files/deployment.yml)
          echo "$result"

      - name: Set commit ID as an environment variable
        run: echo "COMMIT_COUNT=$(git rev-list --count HEAD)" >> $GITHUB_ENV

      # - name: Modify Client yml
      #   uses: teunmooij/yml@v1
      #   with:
      #     from-file: "deployment-files/deployment.yml"
      #     to-file: "deployment-files/deployment.yml"
      #     merge: '{"spec.template.spec.containers[0].image": "exartadev/zeniva.exarta:livestream-frontend-v${{ env.COMMIT_COUNT }}-asrpods"}'

      - name: Update Deployment Image with sed
        run: |
          sed -i 's|image: .*|image: exartadev/zeniva.exarta:livestream-frontend-v${{ env.COMMIT_COUNT }}-asrpods|' deployment-files/deployment.yml


      - name: Setup Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - run: kubectl version --client

      - uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: "${{secrets.KUBE_CONFIG}}"
        with:
          args: |
            apply -f deployment-files/deployment.yml

      - name: Commit and push changes
        run: |
          cd deployment-files
          git config --global user.email "sanasweetu4@gmail.com"
          git config --global user.name "SafaHussain"
          git add deployment.yml
          git commit -m "Update livestream-frontend-v${COMMIT_COUNT} image tag to deployment.yml"
          git push
